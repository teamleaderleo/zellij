name: Fieldwork Telugu width probe

on:
  pull_request:
    branches:
      - research/upstream-4800-snapshot
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telugu-width:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pkg-config libssl-dev

      - name: Record exact source identity
        env:
          EXPECTED_BASE: d5c04daccfac765814e55ef2b89543bbe711629d
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euxo pipefail
          git rev-parse HEAD
          git show -s --format='%H %s' HEAD
          printf 'event_base=%s\n' "$EVENT_BASE"
          printf 'event_head=%s\n' "$EVENT_HEAD"
          test "$EVENT_BASE" = "$EXPECTED_BASE"
          test -n "$EVENT_HEAD"

      - name: Inject execution-only target-native controls
        run: |
          set -euxo pipefail
          cat fieldwork/telugu_width_probe_tests.rs >> zellij-server/src/panes/unit/grid_tests.rs
          tail -n 120 zellij-server/src/panes/unit/grid_tests.rs

      - name: Execute focused Zellij grid controls
        run: |
          set -euxo pipefail
          cargo test --locked -p zellij-server fieldwork_telugu --lib -- --nocapture

      - name: Preserve exact receipt
        if: always()
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          printf 'base=%s\n' "$EVENT_BASE"
          printf 'carrier_head=%s\n' "$EVENT_HEAD"
          printf 'checkout=%s\n' "$(git rev-parse HEAD)"
          printf 'tests=%s\n' 'fieldwork_telugu_*'
          git diff -- zellij-server/src/panes/unit/grid_tests.rs
